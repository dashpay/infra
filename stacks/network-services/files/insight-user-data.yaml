#cloud-config
bootcmd:
  - - sh
    - -c
    - |
      U=60b7bce5-835c-4142-98db-c6412287d44d
      for n in $(seq 1 60); do blkid -U $U >/dev/null 2>&1 && break; sleep 1; done
      grep -q $U /etc/fstab || echo "UUID=$U /mnt ext4 defaults,nofail 0 2" >> /etc/fstab
      mkdir -p /etc/systemd/system/docker.service.d
      printf '[Unit]\nRequiresMountsFor=/mnt\n' > /etc/systemd/system/docker.service.d/10-chain-volume.conf
      mountpoint -q /mnt || mount -U $U /mnt
      systemctl daemon-reload
