AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  CloudFront in front of the Dash quorum service. One stack per network
  (testnet, mainnet, devnet-*). Origin is the existing ELB; /quorums,
  /previous and /masternodes are cached at the edge on a path-only key.

Parameters:
  HostName:
    Type: String
    Default: quorums.testnet.networks.dash.org
    Description: Public hostname the browsers hit (also the CloudFront alias)
  OriginDomainName:
    Type: String
    Description: DNS name of the existing ELB/ALB that serves the quorum service
  AcmCertificateArn:
    Type: String
    Description: ACM certificate in us-east-1 whose SANs cover HostName
  OriginShieldRegion:
    Type: String
    Default: us-east-1
    Description: Region closest to the ELB. All POPs fetch through this one cache, so the origin sees at most ~1 request per TTL.
  CacheTtlSeconds:
    Type: Number
    Default: 30
    MinValue: 1
  WarmPingPath:
    Type: String
    Default: /quorums
    Description: Path the Route 53 health check requests every 30 s to keep the origin warm

Resources:
  # ---- cache key: path only. No cookies, no query string, no headers. ----
  PathOnlyCachePolicy:
    Type: AWS::CloudFront::CachePolicy
    Properties:
      CachePolicyConfig:
        Name: !Sub '${AWS::StackName}-path-only'
        Comment: Path-only cache key with a fixed TTL; Origin is NOT in the key because the origin answers ACAO:*
        MinTTL: !Ref CacheTtlSeconds
        DefaultTTL: !Ref CacheTtlSeconds
        MaxTTL: !Ref CacheTtlSeconds
        ParametersInCacheKeyAndForwardedToOrigin:
          EnableAcceptEncodingGzip: true
          EnableAcceptEncodingBrotli: true
          HeadersConfig:
            HeaderBehavior: none
          CookiesConfig:
            CookieBehavior: none
          QueryStringsConfig:
            QueryStringBehavior: none

  # ---- what reaches the ELB: Host (it routes mainnet/testnet by host) + CORS request headers ----
  CorsHostOriginRequestPolicy:
    Type: AWS::CloudFront::OriginRequestPolicy
    Properties:
      OriginRequestPolicyConfig:
        Name: !Sub '${AWS::StackName}-cors-host'
        Comment: Forward Host and the CORS request headers to the ELB; nothing else
        HeadersConfig:
          HeaderBehavior: whitelist
          Headers:
            - Host
            - Origin
            - Access-Control-Request-Method
            - Access-Control-Request-Headers
        CookiesConfig:
          CookieBehavior: none
        QueryStringsConfig:
          QueryStringBehavior: none

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub 'Dash quorum service edge for ${HostName}'
        Aliases:
          - !Ref HostName
        HttpVersion: http2and3          # HTTP/2 + HTTP/3 (QUIC) at the edge
        IPV6Enabled: true
        PriceClass: PriceClass_All      # includes the Bangkok POP
        ViewerCertificate:
          AcmCertificateArn: !Ref AcmCertificateArn
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021   # negotiates TLS 1.3 with modern clients
        Origins:
          - Id: quorum-elb
            DomainName: !Ref OriginDomainName
            ConnectionAttempts: 3
            ConnectionTimeout: 10
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              HTTPSPort: 443
              OriginSSLProtocols:
                - TLSv1.2
              OriginReadTimeout: 30       # cold origin needs ~10 s; do not cut it off
              OriginKeepaliveTimeout: 60  # keep the CloudFront->ELB connection open between fetches
            OriginShield:
              Enabled: true
              OriginShieldRegion: !Ref OriginShieldRegion
        DefaultCacheBehavior:            # anything not listed below: pass through, uncached
          TargetOriginId: quorum-elb
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS]
          CachedMethods: [GET, HEAD]
          Compress: true
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad   # AWS managed: CachingDisabled
          OriginRequestPolicyId: !Ref CorsHostOriginRequestPolicy
        CacheBehaviors:
          - PathPattern: /quorums
            TargetOriginId: quorum-elb
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD, OPTIONS]
            CachedMethods: [GET, HEAD]
            Compress: true
            CachePolicyId: !Ref PathOnlyCachePolicy
            OriginRequestPolicyId: !Ref CorsHostOriginRequestPolicy
          - PathPattern: /previous
            TargetOriginId: quorum-elb
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD, OPTIONS]
            CachedMethods: [GET, HEAD]
            Compress: true
            CachePolicyId: !Ref PathOnlyCachePolicy
            OriginRequestPolicyId: !Ref CorsHostOriginRequestPolicy
          - PathPattern: /masternodes
            TargetOriginId: quorum-elb
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD, OPTIONS]
            CachedMethods: [GET, HEAD]
            Compress: true
            CachePolicyId: !Ref PathOnlyCachePolicy
            OriginRequestPolicyId: !Ref CorsHostOriginRequestPolicy

  # ---- keep the origin warm: 8 Route 53 checkers, every 30 s, through the edge.
  #      With Origin Shield that is ~2 origin fetches/min and it also keeps the shield cache fresh. ----
  WarmPing:
    Type: AWS::Route53::HealthCheck
    Properties:
      HealthCheckConfig:
        Type: HTTPS
        FullyQualifiedDomainName: !Ref HostName
        Port: 443
        ResourcePath: !Ref WarmPingPath
        RequestInterval: 30
        FailureThreshold: 3
        EnableSNI: true
        MeasureLatency: true
      HealthCheckTags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-warm-ping'

Outputs:
  DistributionId:
    Value: !Ref Distribution
  DistributionDomainName:
    Description: Point the Route 53 alias records here (hosted zone Z2FDTNDATAQYW2)
    Value: !GetAtt Distribution.DomainName
  WarmPingHealthCheckId:
    Value: !Ref WarmPing
